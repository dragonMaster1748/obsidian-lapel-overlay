name: Build and export plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Compile production build
        run: pnpm run build:ci

      - name: Validate compiled plugin
        shell: bash
        run: |
          set -euo pipefail
          test -s main.js
          test -s manifest.json
          test -s styles.css
          node -e 'const m=require("./manifest.json"); if(m.isDesktopOnly !== false) throw new Error("manifest must remain mobile-compatible"); if(m.id !== "lapel-overlay") throw new Error("unexpected plugin id");'
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            MANIFEST_VERSION="$(node -p 'require("./manifest.json").version')"
            if [[ "${GITHUB_REF_NAME}" != "${MANIFEST_VERSION}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${MANIFEST_VERSION}."
              exit 1
            fi
          fi

      - name: Assemble installable plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/lapel-overlay
          cp main.js manifest.json styles.css dist/lapel-overlay/
          echo "Plugin contents:"
          find dist/lapel-overlay -maxdepth 1 -type f -printf '%f\n' | sort

      # GitHub Actions artifacts are already downloaded as ZIP archives.
      # Upload the plugin folder itself so the downloaded artifact contains the
      # installable folder directly instead of a ZIP nested inside another ZIP.
      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: lapel-overlay
          path: dist/lapel-overlay
          if-no-files-found: error
          retention-days: 30

      - name: Create ZIP for tagged GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          cd dist
          zip -r lapel-overlay.zip lapel-overlay

      - name: Create GitHub release for version tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Lapel Overlay ${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css dist/lapel-overlay.zip
