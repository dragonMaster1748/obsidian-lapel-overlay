name: Release plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Compile production build
        run: pnpm run build:ci

      - name: Validate release files and version
        shell: bash
        run: |
          set -euo pipefail
          test -s main.js
          test -s manifest.json
          test -s styles.css
          node -e 'const m=require("./manifest.json"); if(m.isDesktopOnly !== false) throw new Error("manifest must remain mobile-compatible"); if(m.id !== "lapel-overlay") throw new Error("unexpected plugin id");'
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            MANIFEST_VERSION="$(node -p 'require("./manifest.json").version')"
            if [[ "${GITHUB_REF_NAME}" != "${MANIFEST_VERSION}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${MANIFEST_VERSION}."
              exit 1
            fi
          fi

      - name: Create one installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/lapel-overlay
          cp main.js manifest.json styles.css dist/lapel-overlay/
          cd dist
          zip -r lapel-overlay.zip lapel-overlay
          unzip -l lapel-overlay.zip

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapel-overlay-release
          path: |
            dist/lapel-overlay.zip
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Lapel Overlay ${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css dist/lapel-overlay.zip
